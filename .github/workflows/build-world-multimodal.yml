name: Build world_multimodal

# A test build of the world multimodal network on a standard runner (16 GB of memory),
# started by a push to this branch. The network and the log are kept as artifacts.
on:
  push:
    branches:
      - build/world-multimodal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      SCGRAPH_REQUIRE_CPP: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # The same planet file (same size and ETag) on the us-west-2 mirror, which a
      # runner reads faster than the eu-central-1 mirror of the code (lab E68).
      - name: Read the planet from the us-west-2 mirror
        run: |
          sed -i 's/osm-planet-eu-central-1\.s3\.dualstack\.eu-central-1/osm-planet-us-west-2.s3.dualstack.us-west-2/' \
            scgraph/pipelines/steps/stage1_extract/osm.py
          grep -n 'us-west-2' scgraph/pipelines/steps/stage1_extract/osm.py
      - name: Install scgraph with the C++ extension and osmium
        run: |
          uv sync --extra osm
          uv run python -c "from scgraph.utils import has_cpp; assert has_cpp()"
      - name: Build and validate
        run: |
          mkdir -p out
          uv run python - world_multimodal --cache-dir out/cache --work-dir out/work --validate \
            > out/world.log 2>&1 <<'PY' || status=$?
          import logging, sys
          class Steps(logging.Formatter):
              def format(self, record):
                  text = super().format(record)
                  return text + (f" {record.scgraph}" if hasattr(record, "scgraph") else "")
          handler = logging.StreamHandler()
          handler.setFormatter(Steps("%(asctime)s %(name)s %(message)s"))
          logging.basicConfig(level=logging.DEBUG, handlers=[handler])
          logging.getLogger("urllib3").setLevel(logging.WARNING)
          from scgraph.pipelines.build import main
          main(sys.argv[1:])
          PY
          grep -v ' of .* GB read' out/world.log | tail -80
          exit ${status:-0}
      - name: Free memory and disk at the end
        if: always()
        run: |
          free -m
          df -h /
          find out -name "*.scgraph" -exec ls -la {} + || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-multimodal-log
          path: out/world.log
      # A network that fails validation stays in the work folder: kept to study it
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-multimodal-network
          path: out/**/*.scgraph
          retention-days: 14
